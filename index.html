<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxz Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#070D18;
    --bg-2:#0B1526;
    --panel:#0F1B2E;
    --panel-2:#13233A;
    --border:#1C2C44;
    --border-light:#28405F;
    --text:#EAF1FA;
    --text-dim:#90A5C2;
    --text-faint:#5B6E8C;
    --accent:#22A6E8;
    --accent-2:#0B84C9;
    --accent-pale:#DCEFFC;
    --confirm:#16C79A;
    --confirm-2:#0FA57F;
    --price:#22C55E;
    --danger:#EF4444;
    --warn:#F59E0B;
    --radius:16px;
    --radius-sm:10px;
    --shadow:0 12px 32px rgba(2,7,16,.5);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{font-family:'Manrope',sans-serif;margin:0;}
  p{margin:0;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:var(--accent);color:#04121F;}

  #app{min-height:100vh;display:flex;flex-direction:column;}

  .header{position:sticky;top:0;z-index:40;background:rgba(7,13,24,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:14px 20px;gap:12px;}
  .logo{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .logo-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .logo-text{font-weight:800;font-size:19px;letter-spacing:.2px;}
  .logo-text span{color:var(--accent);}
  .header-right{display:flex;align-items:center;gap:10px;}
  .icon-btn{width:40px;height:40px;border-radius:11px;background:var(--panel-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-dim);transition:.15s;}
  .icon-btn:hover{color:var(--text);border-color:var(--border-light);}
  .account-btn{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--border);padding:6px 12px 6px 6px;border-radius:12px;color:var(--text);position:relative;}
  .avatar{width:28px;height:28px;border-radius:8px;background:linear-gradient(145deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#04121F;flex-shrink:0;}
  .account-name{font-size:14px;font-weight:600;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .btn{border:none;border-radius:11px;padding:10px 18px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;transition:.15s;white-space:nowrap;}
  .btn-accent{background:var(--accent);color:#04121F;}
  .btn-accent:hover{background:#3fb4ef;}
  .btn-confirm{background:var(--confirm);color:#052e22;}
  .btn-confirm:hover{background:#1fe0ae;}
  .btn-outline{background:transparent;color:var(--text);border:1px solid var(--border-light);}
  .btn-outline:hover{border-color:var(--accent);}
  .btn-ghost{background:var(--panel-2);color:var(--text-dim);border:1px solid var(--border);}
  .btn-ghost:hover{color:var(--text);}
  .btn-danger{background:rgba(239,68,68,.12);color:#FF8080;border:1px solid rgba(239,68,68,.35);}
  .btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  .dropdown{position:absolute;top:52px;right:0;background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow);min-width:230px;overflow:hidden;z-index:50;}
  .dropdown-head{padding:14px;border-bottom:1px solid var(--border);}
  .dropdown-head .name{font-weight:700;font-size:14.5px;}
  .dropdown-head .mail{font-size:12.5px;color:var(--text-dim);margin-top:2px;}
  .dropdown-item{display:flex;align-items:center;gap:10px;padding:11px 14px;font-size:14px;font-weight:600;color:var(--text);border-bottom:1px solid var(--border);}
  .dropdown-item:last-child{border-bottom:none;}
  .dropdown-item:hover{background:var(--panel);}
  .dropdown-item.danger{color:#FF8080;}
  .dropdown-item .tag{margin-left:auto;font-size:12px;color:var(--confirm);font-weight:700;}

  .main{flex:1;max-width:1180px;margin:0 auto;width:100%;padding:22px 20px 90px;}

  .hero{position:relative;overflow:hidden;border-radius:22px;background:radial-gradient(120% 140% at 15% 10%,#123152 0%,#0A1830 45%,#060C16 100%);border:1px solid var(--border);padding:38px 30px;margin-bottom:26px;}
  .hero-eyebrow{color:var(--accent);font-weight:700;font-size:13px;margin-bottom:10px;}
  .hero h1{font-size:34px;line-height:1.15;font-weight:800;max-width:560px;}
  .hero p.sub{margin-top:12px;color:var(--text-dim);max-width:480px;font-size:15px;line-height:1.6;}
  .hero-stats{display:flex;gap:26px;margin-top:24px;flex-wrap:wrap;}
  .hero-stat b{font-size:22px;font-weight:800;display:block;}
  .hero-stat span{font-size:12.5px;color:var(--text-faint);}

  .tabs{display:flex;gap:8px;overflow-x:auto;margin:22px 0 18px;padding-bottom:4px;}
  .tab{flex-shrink:0;background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);padding:9px 16px;border-radius:11px;font-weight:700;font-size:13.5px;}
  .tab.active{background:var(--accent);color:#04121F;border-color:var(--accent);}

  .section-title{font-size:22px;font-weight:800;margin:30px 0 4px;}
  .section-sub{color:var(--text-faint);font-size:13.5px;margin-bottom:16px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:.15s;}
  .card:hover{border-color:var(--border-light);}
  .card-img{height:150px;background:linear-gradient(135deg,#0E1F35,#0A1626);display:flex;align-items:center;justify-content:center;position:relative;}
  .card-img img{width:100%;height:100%;object-fit:cover;}
  .card-body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:7px;width:fit-content;}
  .badge-verified{background:rgba(22,199,154,.14);color:var(--confirm);}
  .badge-cat{background:rgba(34,166,232,.12);color:var(--accent);}
  .badge-bestseller{background:rgba(245,158,11,.15);color:var(--warn);}
  .badge-new{background:rgba(34,166,232,.15);color:var(--accent);}
  .badge-sale{background:rgba(239,68,68,.15);color:var(--danger);}
  .card-title{font-size:15.5px;font-weight:700;}
  .card-desc{font-size:12.5px;color:var(--text-dim);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card-price{color:var(--price);font-weight:800;font-size:15px;margin-top:auto;}
  .card-price span{color:var(--text-faint);font-weight:500;font-size:11.5px;}
  .card-actions{display:flex;gap:8px;margin-top:8px;}
  .card-actions .btn{flex:1;justify-content:center;}
  .admin-card-actions{display:flex;gap:6px;position:absolute;top:8px;right:8px;}
  .icon-chip{width:30px;height:30px;border-radius:8px;background:rgba(4,10,20,.7);border:1px solid var(--border-light);display:flex;align-items:center;justify-content:center;color:var(--text);}
  .icon-chip:hover{background:var(--accent);color:#04121F;}
  .icon-chip.danger:hover{background:var(--danger);color:#fff;}

  .empty-state{border:1px dashed var(--border-light);border-radius:var(--radius);padding:50px 20px;text-align:center;color:var(--text-dim);}
  .empty-state svg{margin-bottom:10px;opacity:.55;}
  .empty-state h3{color:var(--text);margin-bottom:6px;}

  .props{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:44px;}
  .prop{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:22px;}
  .prop-icon{width:44px;height:44px;border-radius:12px;background:rgba(34,166,232,.12);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
  .prop h4{font-size:15px;margin-bottom:6px;}
  .prop p{font-size:13px;color:var(--text-dim);line-height:1.5;}

  .footer{border-top:1px solid var(--border);padding:30px 20px;margin-top:50px;text-align:center;color:var(--text-faint);font-size:12.5px;}
  .footer .flinks{display:flex;justify-content:center;gap:18px;margin-bottom:14px;font-size:13px;color:var(--text-dim);font-weight:600;}
  .footer .fsocials{display:flex;justify-content:center;gap:12px;margin-bottom:16px;}
  .social-btn{width:52px;height:52px;border-radius:16px;background:var(--panel-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-dim);transition:.15s;cursor:pointer;}
  .social-btn:hover{color:var(--accent);border-color:var(--accent);background:rgba(34,166,232,.08);}

  .fab{position:fixed;bottom:20px;right:20px;width:54px;height:54px;border-radius:50%;background:linear-gradient(145deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(34,166,232,.35);z-index:60;border:none;color:#04121F;}

  .auth-wrap{max-width:400px;margin:60px auto;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:30px;}
  .auth-wrap h2{font-size:22px;margin-bottom:6px;}
  .auth-wrap .sub{color:var(--text-dim);font-size:13.5px;margin-bottom:22px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--text-dim);margin-bottom:6px;}
  .input{width:100%;background:var(--bg-2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px 13px;font-size:14px;outline:none;}
  .input:focus{border-color:var(--accent);}
  textarea.input{resize:vertical;min-height:70px;}
  .auth-err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#FF9C9C;font-size:13px;padding:10px 12px;border-radius:9px;margin-bottom:14px;}
  .auth-ok{background:rgba(22,199,154,.1);border:1px solid rgba(22,199,154,.3);color:#7BEFCB;font-size:13px;padding:10px 12px;border-radius:9px;margin-bottom:14px;}
  .auth-hint{margin-top:16px;font-size:12px;color:var(--text-faint);background:var(--bg-2);border:1px solid var(--border);padding:10px 12px;border-radius:9px;}
  .auth-switch{margin-top:18px;text-align:center;font-size:13.5px;color:var(--text-dim);}
  .auth-switch b{color:var(--accent);cursor:pointer;}

  .overlay{position:fixed;inset:0;background:rgba(3,7,14,.72);display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:0;}
  .modal{background:var(--panel-2);border:1px solid var(--border);width:100%;max-width:520px;border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow);}
  @media(min-width:640px){.overlay{align-items:center;padding:20px;} .modal{border-radius:18px;max-height:85vh;}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel-2);}
  .modal-head h3{font-size:16.5px;display:flex;align-items:center;gap:9px;}
  .modal-body{padding:20px;}
  .modal-foot{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--border);}
  .modal-foot .btn{flex:1;justify-content:center;}
  .close-x{background:none;border:none;color:var(--text-dim);width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;}
  .close-x:hover{background:var(--panel);color:var(--text);}

  .steps{display:flex;align-items:center;justify-content:center;gap:8px;padding:18px 20px 0;}
  .step-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--bg-2);color:var(--text-faint);border:1px solid var(--border);}
  .step-dot.done{background:var(--confirm);color:#052e22;border-color:var(--confirm);}
  .step-dot.current{background:var(--accent);color:#04121F;border-color:var(--accent);}
  .step-line{width:26px;height:2px;background:var(--border);}

  .variant-row{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border:1px solid var(--border);border-radius:11px;margin-bottom:9px;cursor:pointer;}
  .variant-row.selected{border-color:var(--accent);background:rgba(34,166,232,.08);}
  .variant-row.disabled{opacity:.4;cursor:not-allowed;}
  .variant-left b{font-size:14px;display:block;}
  .variant-left span{font-size:11.5px;color:var(--text-faint);}
  .variant-price{color:var(--price);font-weight:800;font-size:14.5px;}
  .radio{width:19px;height:19px;border-radius:50%;border:2px solid var(--border-light);flex-shrink:0;}
  .variant-row.selected .radio{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 0 40%,transparent 42%);}

  .qty-box{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:11px;padding:12px 14px;margin-top:16px;}
  .qty-controls{display:flex;align-items:center;gap:14px;}
  .qty-btn{width:30px;height:30px;border-radius:8px;background:var(--panel);border:1px solid var(--border-light);color:var(--text);display:flex;align-items:center;justify-content:center;}
  .qty-val{font-weight:800;min-width:18px;text-align:center;}

  .buyer-box{border:1px solid var(--confirm);background:rgba(22,199,154,.06);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;}
  .buyer-box .avatar{width:38px;height:38px;font-size:15px;}
  .buyer-box .bname{font-weight:700;font-size:14.5px;}
  .buyer-box .bline{font-size:12.5px;color:var(--text-dim);display:flex;align-items:center;gap:6px;margin-top:2px;}

  .pay-option{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;}
  .pay-option.selected{border-color:var(--accent);background:rgba(34,166,232,.07);}
  .pay-option .pl{display:flex;align-items:center;gap:12px;}
  .pay-icon{width:38px;height:38px;border-radius:10px;background:var(--bg-2);display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0;}
  .pay-name{font-weight:700;font-size:14px;}
  .pay-sub{font-size:11.5px;color:var(--text-faint);}
  .check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border-light);display:flex;align-items:center;justify-content:center;color:transparent;}
  .pay-option.selected .check{border-color:var(--accent);background:var(--accent);color:#04121F;}

  .total-bar{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#04121F;border-radius:12px;padding:14px 16px;margin:16px 0;font-weight:800;}
  .total-bar span:first-child{display:flex;align-items:center;gap:8px;font-size:13.5px;}
  .total-bar span:last-child{font-size:20px;}

  .profile-grid{display:grid;grid-template-columns:280px 1fr;gap:20px;}
  @media(max-width:760px){.profile-grid{grid-template-columns:1fr;}}
  .balance-card{background:linear-gradient(120deg,var(--accent),var(--accent-2));border-radius:var(--radius);padding:20px;color:#04121F;}
  .balance-card .lbl{font-size:12.5px;font-weight:700;opacity:.85;display:flex;align-items:center;gap:7px;}
  .balance-card .amt{font-size:30px;font-weight:800;margin:8px 0 14px;}
  .info-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-top:14px;}
  .info-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
  .info-row:last-child{border-bottom:none;}
  .info-row span:first-child{color:var(--text-faint);}
  .order-row{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .order-dot{width:9px;height:9px;border-radius:50%;background:var(--confirm);flex-shrink:0;}
  .order-info{flex:1;}
  .order-info b{font-size:14px;}
  .order-info div{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
  .order-price{color:var(--price);font-weight:800;}
  .status-pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;}
  .status-Pendiente{background:rgba(245,158,11,.15);color:var(--warn);}
  .status-Enviado{background:rgba(34,166,232,.15);color:var(--accent);}
  .status-Entregado{background:rgba(22,199,154,.15);color:var(--confirm);}
  .status-Cancelado{background:rgba(239,68,68,.15);color:var(--danger);}

  .admin-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
  .admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;}
  .stat-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
  .stat-card .stat-label{font-size:12px;color:var(--text-faint);font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:8px;}
  .stat-card .stat-value{font-size:22px;font-weight:800;}
  .stat-card .stat-value small{font-size:12.5px;color:var(--text-faint);font-weight:600;}
  .cat-add-row{display:flex;gap:8px;margin-bottom:16px;}
  .cat-add-row .input{flex:1;}
  .cat-chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:8px;}
  .cat-chip span{flex:1;font-weight:600;font-size:13.5px;}
  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);}
  table{width:100%;border-collapse:collapse;min-width:640px;}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-faint);padding:12px 14px;background:var(--panel-2);border-bottom:1px solid var(--border);}
  td{padding:12px 14px;font-size:13.5px;border-bottom:1px solid var(--border);color:var(--text);}
  tr:last-child td{border-bottom:none;}
  .role-pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:7px;}
  .role-admin{background:rgba(34,166,232,.15);color:var(--accent);}
  .role-owner{background:rgba(245,158,11,.18);color:var(--warn);}
  .role-user{background:var(--panel);color:var(--text-dim);border:1px solid var(--border);}
  .ban-pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:7px;background:rgba(239,68,68,.15);color:var(--danger);}
  .ok-pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:7px;background:rgba(22,199,154,.15);color:var(--confirm);}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .variant-form-row{display:grid;grid-template-columns:1fr 90px 80px 34px;gap:8px;margin-bottom:8px;align-items:center;}
  .variant-form-row .input{padding:9px 10px;font-size:13px;}
  .toggle-row{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;margin:14px 0;}
  .toggle{width:40px;height:23px;border-radius:20px;background:var(--border);position:relative;cursor:pointer;flex-shrink:0;}
  .toggle.on{background:var(--confirm);}
  .toggle::after{content:'';position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.15s;}
  .toggle.on::after{left:19px;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--border-light);color:var(--text);padding:12px 20px;border-radius:11px;box-shadow:var(--shadow);z-index:200;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;max-width:88vw;text-align:center;}

  .center-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:14px;color:var(--text-dim);}
  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  @media(max-width:600px){
    .hero h1{font-size:26px;}
    .account-name{display:none;}
    .header{padding:12px 14px;}
  }
</style>

function uid(p){ return (p||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ return '$' + Number(n||0).toFixed(2); }
function fmtDate(d){ const dt=new Date(d); return dt.toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'})+' '+dt.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}); }

function getUser(){ return state.currentProfile; }
function isAdmin(){ const u=getUser(); return !!u && (u.role==='admin' || u.role==='owner'); }
function isOwner(){ const u=getUser(); return !!u && u.role==='owner'; }
function roleLabel(u){ return u.role==='owner'?'Propietario':u.role==='admin'?'Administrador':'Cliente'; }
function lowestPrice(p){ if(!p.variants||!p.variants.length) return null; return Math.min(...p.variants.map(v=>Number(v.price))); }
function effectiveStock(productId, variantLabel, fallback){
  const lc = state.licenseCounts.find(x=>x.product_id===productId && x.variant_label===variantLabel);
  if(lc && lc.total>0) return lc.available;
  return fallback;
}
function isProductSoldOut(p){
  if(!p.variants || !p.variants.length) return false;
  return p.variants.every(v=>{
    const stk = effectiveStock(p.id, v.label, v.stock);
    return stk!=null && stk<=0;
  });
}
function copyCode(code){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(()=>showToast('Código copiado.')).catch(()=>showToast('No se pudo copiar automáticamente.'));
  } else {
    showToast('Copia manual: ' + code);
  }
}

function showToast(msg){
  state.toast = msg;
  render();
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>{ state.toast=null; render(); }, 3200);
}

/* ---------------- SUPABASE DATA LAYER ---------------- */
async function fetchProfile(id){
  const { data, error } = await sb.from('profiles').select('*').eq('id', id).single();
  if(error) return null;
  return data;
}
async function fetchProducts(){
  const { data, error } = await sb.from('products').select('*').order('created_at', { ascending:true });
  if(!error) state.products = data || [];
}
async function fetchUsers(){
  if(!isAdmin()){ state.users = []; return; }
  const { data, error } = await sb.from('profiles').select('*').order('created_at', { ascending:true });
  if(!error) state.users = data || [];
}

  const u = getUser();
  if(!u){ state.purchases = []; return; }
  let q = sb.from('purchases').select('*').order('created_at', { ascending:false });
  if(!isAdmin()) q = q.eq('user_id', u.id);
  const { data, error } = await q;
  if(!error) state.purchases = data || [];
}
async function fetchLogins(){
  if(!isAdmin()){ state.logins = []; return; }

  if(!error) state.logins = data || [];
}

}
async function fetchPaymentMethods(){

}
async function fetchBalanceHistory(){
  const u = getUser();
  if(!u){ state.balanceHistory = []; return; }
  let q = sb.from('balance_transactions').select('*').order('created_at', { ascending:false }).limit(100);
  if(!isAdmin()) q = q.eq('user_id', u.id);

}
async function fetchTopupRequests(){

  if(!u){ state.topupRequests = []; return; }
  let q = sb.from('topup_requests').select('*').order('created_at', { ascending:false }).limit(100);
  if(!isAdmin()) q = q.eq('user_id', u.id);
  const { data, error } = await q;
  if(!error) state.topupRequests = data || [];
}
async function fetchLicenses(){
  if(!isAdmin()){ state.licenses = []; return; }
  const { data, error } = await sb.from('licenses').select('*').order('created_at', { ascending:true });
  if(!error) state.licenses = data || [];
}

  const { data, error } = await sb.rpc('get_license_counts');
  if(!error) state.licenseCounts = data || [];
}
async function refreshAfterAuth(){
  await fetchProducts();
  await fetchCategories();
  await fetchPaymentMethods();
  await fetchPurchases();
  await fetchBalanceHistory();
  await fetchTopupRequests();
  await fetchLicenseCounts();
  if(isAdmin()){ await fetchUsers(); await fetchLogins(); await fetchLicenses(); } else { state.users=[]; state.logins=[]; state.licenses=[]; }
}

/* ---------------- INIT ---------------- */
async function init(){
  if(NEEDS_SETUP){ state.view='setup'; return render(); }
  try{
    const { data: { session } } = await sb.auth.getSession();
    if(session){
      const profile = await fetchProfile(session.user.id);
      if(profile && !profile.banned) state.currentProfile = profile;
      else if(profile && profile.banned) await sb.auth.signOut();
    }
  }catch(e){}
  await fetchProducts();
  await fetchCategories();
  await fetchPaymentMethods();
  await fetchLicenseCounts();
  if(state.currentProfile) await refreshAfterAuth();
  state.view='store';
  render();
}

/* ---------------- AUTH ---------------- */
async function doLogin(){
  const email = document.getElementById('li-mail').value.trim();
  const password = document.getElementById('li-pass').value;
  if(!email || !password){ state.loginErr='Completa correo y contraseña.'; return render(); }
  state.busy = true; render();
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  state.busy = false;
  if(error){ state.loginErr = 'No se pudo iniciar sesión: ' + error.message; return render(); }
  const profile = await fetchProfile(data.user.id);
  if(!profile){ state.loginErr='No se encontró tu perfil. Contacta con soporte.'; await sb.auth.signOut(); return render(); }
  if(profile.banned){ state.loginErr='Esta cuenta está suspendida.'; await sb.auth.signOut(); return render(); }
  state.currentProfile = profile;
  state.loginErr='';
  await sb.from('logins').insert({ user_id: profile.id, username: profile.username, role: profile.role });
  await refreshAfterAuth();
  state.view='store';
  render();
}

async function doRegister(){
  const username = document.getElementById('re-user').value.trim();
  const email = document.getElementById('re-mail').value.trim();
  const password = document.getElementById('re-pass').value;
  if(!username || !email || !password){ state.registerErr='Completa todos los campos.'; return render(); }
  if(password.length < 6){ state.registerErr='La contraseña debe tener al menos 6 caracteres.'; return render(); }
  state.busy = true; render();
  const { count } = await sb.from('profiles').select('id', { count:'exact', head:true }).eq('username', username);
  if(count && count > 0){ state.busy=false; state.registerErr='Ese usuario ya existe.'; return render(); }
  const { data, error } = await sb.auth.signUp({ email, password, options:{ data:{ username } } });
  state.busy = false;
  if(error){ state.registerErr='No se pudo crear la cuenta: ' + error.message; return render(); }
  if(data.session){
    let profile = null;
    for(let i=0;i<5 && !profile;i++){
      profile = await fetchProfile(data.user.id);
      if(!profile) await new Promise(r=>setTimeout(r,400));
    }
    if(!profile){ state.registerErr='Cuenta creada, pero tu perfil tardó en generarse. Intenta iniciar sesión en unos segundos.'; state.view='login'; return render(); }
    state.currentProfile = profile;
    await sb.from('logins').insert({ user_id: data.user.id, username, role:'user' });
    await refreshAfterAuth();
    state.view='store';
    showToast('Cuenta creada. ¡Bienvenido a Luxz Store!');
  } else {
    state.registerErr='';
    state.registerOk='Cuenta creada. Revisa tu correo para confirmarla y luego inicia sesión.';
    state.view='login';
    render();
  }
}

async function doLogout(){
  await sb.auth.signOut();
  state.currentProfile = null;
  state.users=[]; state.purchases=[]; state.logins=[];
  state.userMenuOpen = false;
  state.view='store';
  render();
}

/* ---------------- PURCHASE FLOW ---------------- */
function openPurchase(productId){
  if(!getUser()){ state.view='login'; state.loginErr='Inicia sesión para comprar.'; return render(); }
  const product = state.products.find(p=>p.id===productId);
  if(!product || isProductSoldOut(product)){ showToast('Este producto está agotado por ahora.'); return; }
  state.modal='purchase';
  state.purchase = { product, step:1, variantId:null, qty:1, payment:'balance' };
  render();
}
function selectVariant(vid){ state.purchase.variantId=vid; render(); }
function changeQty(d){
  const v = state.purchase.product.variants.find(x=>x.id===state.purchase.variantId);
  const stk = v ? effectiveStock(state.purchase.product.id, v.label, v.stock) : null;
  const max = stk!=null ? stk : 99;
  state.purchase.qty = Math.min(max, Math.max(1, state.purchase.qty + d));
  render();
}
function purchaseNext(){
  if(state.purchase.step===1 && !state.purchase.variantId){ showToast('Selecciona una opción para continuar.'); return; }
  state.purchase.step = Math.min(3, state.purchase.step+1);
  render();
}
function purchasePrev(){ state.purchase.step = Math.max(1, state.purchase.step-1); render(); }
function setPaymentMethod(pm){ state.purchase.payment = pm; render(); }
async function notifyManualPayment(){
  if(WHATSAPP_NUMBER.includes('TU-NUMERO')){ showToast('Falta configurar el número de WhatsApp (WHATSAPP_NUMBER) en el archivo.'); return; }
  const { product, variantId, qty, payment } = state.purchase;
  const variant = product.variants.find(v=>v.id===variantId);
  const stk = effectiveStock(product.id, variant.label, variant.stock);
  if(stk!=null && (stk<=0 || qty>stk)){ showToast('El stock disponible cambió. Ajusta la cantidad o elige otra opción.'); state.purchase.step=1; return render(); }
  const method = state.paymentMethods.find(m=>m.id===payment);
  const refInput = document.getElementById('purchase-ref');
  const ref = refInput ? refInput.value.trim() : '';
  state.busy = true; render();
  const { data, error } = await sb.rpc('make_manual_order', {
    p_product_id: product.id, p_variant_id: variantId, p_qty: qty,
    p_payment_method: method ? method.name : 'Manual', p_binance_ref: ref
  });
  state.busy = false;
  if(error){ showToast(error.message || 'No se pudo crear el pedido.'); return render(); }
  await fetchProducts();
  await fetchPurchases();
  const total = Number(variant.price) * qty;
  const orderRef = data && data.id ? data.id.slice(0,8).toUpperCase() : '';
  const msg = 'Hola, quiero pagar mi pedido' + (orderRef ? ' #' + orderRef : '') + ' en Luxz Store:\n- Producto: ' + product.name +
    ' (' + variant.label + ') x' + qty + '\n- Total: ' + money(total) + '\n- Método: ' + (method?method.name:'') +
    (ref ? '\n- ID de transacción: ' + ref : '') + '\nAdjunto el comprobante de pago.';
  window.open('https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(msg), '_blank');
  await fetchLicenseCounts();
  state.lastOrder = data;
  state.modal = 'orderSuccess';
  render();
}

async function confirmPurchase(){
  const { product, variantId, qty } = state.purchase;
  const variant = product.variants.find(v=>v.id===variantId);
  const stk = effectiveStock(product.id, variant.label, variant.stock);
  if(stk!=null && (stk<=0 || qty>stk)){ showToast('El stock disponible cambió. Ajusta la cantidad o elige otra opción.'); state.purchase.step=1; return render(); }
  state.busy = true; render();
  const { data, error } = await sb.rpc('make_purchase', { p_product_id: product.id, p_variant_id: variantId, p_qty: qty });
  state.busy = false;
  if(error){ showToast(error.message || 'No se pudo completar la compra.'); return render(); }
  state.currentProfile = await fetchProfile(getUser().id);
  await fetchProducts();
  await fetchPurchases();
  await fetchLicenseCounts();
  state.lastOrder = data;
  state.modal = 'orderSuccess';
  render();
}

async function changeUserRole(id, newRole){
  const target = state.users.find(x=>x.id===id);
  if(!target) return;
  if(target.role==='owner' && newRole!=='owner'){
    const owners = state.users.filter(x=>x.role==='owner');
    if(owners.length<=1){ showToast('Debe existir al menos un Owner.'); render(); return; }
  }
  if(target.id===getUser().id && newRole!=='owner' && !confirm('Vas a cambiar tu propio rol. ¿Continuar?')){ render(); return; }
  const { error } = await sb.from('profiles').update({ role:newRole }).eq('id', id);
  if(error){ showToast('No se pudo actualizar: ' + error.message); render(); return; }
  if(target.id===getUser().id) state.currentProfile = await fetchProfile(id);
  await fetchUsers();
  render();
}

  const { error } = await sb.from('profiles').update({ role:newRole }).eq('id', id);
  if(error){ showToast('No se pudo actualizar: ' + error.message); return; }

  render();
}

function renderPurchaseModal(){

      <div class="modal-body">
        ${step===1 ? `
          <div style="font-size:12.5px;font-weight:700;color:var(--text-dim);margin-bottom:10px;">SELECCIONA UNA OPCIÓN</div>

                <span class="variant-price">${money(v.price)}</span><span class="radio"></span>
              </div>
            </div>`;
          }).join('')}
          <div class="qty-box">
            <div><b style="font-size:13.5px;">${ic.cart} Cantidad</b></div>
            <div class="qty-controls">
              <button class="qty-btn" data-action="qty" data-d="-1">${ic.minus}</button>
              <span class="qty-val">${qty}</span>
              <button class="qty-btn" data-action="qty" data-d="1">${ic.plus}</button>
            </div>
          </div>
        ` : ''}
        ${step===2 ? `
          <div style="font-size:12.5px;font-weight:700;color:var(--text-dim);margin-bottom:10px;">DATOS DEL COMPRADOR</div>
          <div class="buyer-box">
            <div class="avatar">${esc(u.username[0].toUpperCase())}</div>
            <div>
              <div class="bname">${esc(u.username)}</div>
              <div class="bline">${esc(u.email)}</div>
              ${u.phone ? `<div class="bline">${esc(u.phone)}</div>` : ''}
            </div>
          </div>
          <div style="margin-top:14px;font-size:12.5px;color:var(--text-faint);">Resumen: ${esc(variant.label)} × ${qty} — <b style="color:var(--price);">${money(total)}</b></div>
        ` : ''}
        ${step===3 ? `
          <div style="font-size:12.5px;font-weight:700;color:var(--text-dim);margin-bottom:10px;">MÉTODO DE PAGO</div>
          <div class="pay-option ${payment==='balance'?'selected':''}" data-action="setPaymentMethod" data-pm="balance">
            <div class="pl"><div class="pay-icon">${ic.wallet}</div><div><div class="pay-name">Pagar con saldo</div><div class="pay-sub">Disponible: ${money(u.balance)}</div></div></div>
            <div class="check">${ic.check}</div>
          </div>
          ${state.paymentMethods.filter(m=>m.enabled).map(m=>`
          <div class="pay-option ${payment===m.id?'selected':''}" data-action="setPaymentMethod" data-pm="${m.id}">
            <div class="pl"><div class="pay-icon">${ic.cart}</div><div><div class="pay-name">${esc(m.name)}</div><div class="pay-sub">Pago manual</div></div></div>
            <div class="check">${ic.check}</div>
          </div>`).join('')}
          ${ (()=>{ const m = state.paymentMethods.find(x=>x.id===payment); return m ? `<div class="auth-hint" style="white-space:pre-wrap;">${esc(m.details)||'Sin instrucciones adicionales.'}</div>

      </div>

        ${step>1 ? `<button class="btn btn-ghost" data-action="purchasePrev">Atrás</button>` : ''}

function computeStats(){
  const totalRevenue = state.purchases.reduce((s,o)=>s+Number(o.price),0);
  const totalOrders = state.purchases.length;
  const now = new Date();
  const monthRevenue = state.purchases.filter(o=>{
    const d = new Date(o.created_at);
    return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  }).reduce((s,o)=>s+Number(o.price),0);
  const byProduct = {};
  state.purchases.forEach(o=>{ byProduct[o.product_name] = (byProduct[o.product_name]||0) + o.qty; });
  let topProduct = '—', topQty = 0;
  Object.entries(byProduct).forEach(([name,qty])=>{ if(qty>topQty){ topQty=qty; topProduct=name; } });
  const totalCustomers = state.users.filter(u=>u.role==='user').length;
  const avgOrder = totalOrders ? totalRevenue/totalOrders : 0;
  return { totalRevenue, totalOrders, monthRevenue, topProduct, topQty, totalCustomers, avgOrder };
}

/* ---------------- EVENTS ---------------- */
function attachEvents(){
  document.getElementById('app').addEventListener('click', onClick);
}
function onClick(e){
  const t = e.target.closest('[data-action]');
  if(!t){
    if(state.userMenuOpen){ state.userMenuOpen=false; render(); }
    return;
  }
  const a = t.dataset.action;
  state.__keepScroll = true;

  if(a==='goto'){
    state.view = t.dataset.view;
    state.userMenuOpen=false;
    if(t.dataset.atab) state.adminTab = t.dataset.atab;
    state.__keepScroll=false;
    return render();
  }
  if(a==='toggleMenu'){ state.userMenuOpen = !state.userMenuOpen; return render(); }
  if(a==='login') return doLogin();
  if(a==='register') return doRegister();
  if(a==='logout') return doLogout();
  if(a==='setCategory'){ state.activeCategory = t.dataset.cat; return render(); }
  if(a==='openPurchase'){ state.__keepScroll=false; return openPurchase(t.dataset.id); }
  if(a==='closeModal'){ state.modal=null; state.productForm=null; return render(); }
  if(a==='closeModalBg'){
    if(e.target.classList.contains('overlay')){ state.modal=null; state.productForm=null; return render(); }
    return;
  }
  if(a==='selectVariant') return selectVariant(t.dataset.vid);
  if(a==='qty') return changeQty(Number(t.dataset.d));
  if(a==='purchaseNext') return purchaseNext();
  if(a==='purchasePrev') return purchasePrev();
  if(a==='setPaymentMethod') return setPaymentMethod(t.dataset.pm);
  if(a==='notifyManualPayment') return notifyManualPayment();
  if(a==='confirmPurchase') return confirmPurchase();
  if(a==='copyCode') return copyCode(t.dataset.code);
  if(a==='openAddBalance'){ state.__keepScroll=false; return openAddBalance(); }
  if(a==='setBalanceMethod'){ state.balanceMethod = t.dataset.bm; return render(); }
  if(a==='submitTopupRequest') return submitTopupRequest();
  if(a==='confirmTopupRequest') return confirmTopupRequest(t.dataset.id);
  if(a==='rejectTopupRequest') return rejectTopupRequest(t.dataset.id);
  if(a==='addLicenses') return addLicenses();
  if(a==='deleteLicense') return deleteLicense(t.dataset.id);
  if(a==='adjustBalance') return adjustBalance(t.dataset.id);
  if(a==='savePhone') return savePhone();
  if(a==='newProduct'){ state.__keepScroll=false; return openProductForm(null); }
  if(a==='editProduct'){ state.__keepScroll=false; return openProductForm(t.dataset.id); }
  if(a==='deleteProduct') return deleteProduct(t.dataset.id);
  if(a==='addVariant') return addVariantRow();
  if(a==='removeVariant') return removeVariantRow(t.dataset.vid);
  if(a==='toggleVerified') return toggleVerified();
  if(a==='saveProductForm') return saveProductForm();
  if(a==='newPaymentMethod'){ state.__keepScroll=false; return openPaymentMethodForm(null); }
  if(a==='editPaymentMethod'){ state.__keepScroll=false; return openPaymentMethodForm(t.dataset.id); }
  if(a==='togglePmEnabled') return togglePmEnabled();
  if(a==='savePaymentMethodForm') return savePaymentMethodForm();
  if(a==='togglePaymentMethod') return togglePaymentMethod(t.dataset.id);
  if(a==='deletePaymentMethod') return deletePaymentMethod(t.dataset.id);
  if(a==='toggleBan') return toggleBan(t.dataset.id);
  if(a==='toggleAdmin') return toggleAdmin(t.dataset.id);
  if(a==='addCategory') return addCategory();
  if(a==='deleteCategory') return deleteCategory(t.dataset.id);
  if(a==='adminTab'){ state.adminTab = t.dataset.t; return render(); }
  if(a==='fabSupport'){
    if(WHATSAPP_NUMBER.includes('TU-NUMERO')){ showToast('Falta configurar el número de WhatsApp (WHATSAPP_NUMBER) en el archivo.'); return; }
    const url = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(WHATSAPP_MESSAGE);
    window.open(url, '_blank');
  }
  if(a==='social'){
    const key = t.dataset.key;
    const url = SOCIAL_LINKS[key];
    if(!url || url.startsWith('TU-')){ showToast('Falta configurar el enlace de ' + SOCIAL_LABELS[key] + ' (SOCIAL_LINKS) en el archivo.'); return; }
    window.open(url, '_blank');
  }
}
document.addEventListener('change', function(e){
  if(e.target.dataset && e.target.dataset.action==='orderStatus'){
    setOrderStatus(e.target.dataset.id, e.target.value);
  }
  if(e.target.dataset && e.target.dataset.action==='changeUserRole'){
    changeUserRole(e.target.dataset.id, e.target.value);
  }
  if(e.target.dataset && e.target.dataset.action==='selectLicenseProduct'){
    selectLicenseProduct(e.target.value);
  }
  if(e.target.dataset && e.target.dataset.action==='selectLicenseVariant'){
    selectLicenseVariant(e.target.value);
  }
});

init();
</script>
